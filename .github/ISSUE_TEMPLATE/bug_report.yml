name: Bug report
description: Report a reproducible problem with a mod or installation.
body:
  - type: input
    id: mod
    attributes:
      label: Mod or bundle
      placeholder: lumen, changes, starter-kit…
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Claude Code version, operating system, terminal/app and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Actual behavior, screenshots or relevant logs
      description: Remove credentials, private paths and sensitive session content.
